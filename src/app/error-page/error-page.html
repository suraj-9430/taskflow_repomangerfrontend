<div class="error-container">
  <div class="error-content">
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-message">Oops! The page you are looking for doesn't exist or has been moved.</p>
    
    <div class="animation-container">
      <i class="fa-solid fa-ghost floating-ghost"></i>
    </div>

    <button class="btn-return" (click)="goBack()">
      <i class="fa-solid fa-house"></i> Return Home
    </button>
  </div>
</div>
